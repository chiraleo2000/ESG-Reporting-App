# SonarQube project config for ESG Reporting App
# Used by: docker run sonarsource/sonar-scanner-cli (see security/README.md)

sonar.projectKey=esg-reporting-app
sonar.projectName=ESG Reporting App
sonar.projectVersion=0.4.0

sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/tests/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info

# Host URL / token are passed at scan time (-Dsonar.host.url / -Dsonar.token)
# Default local SonarQube (compose profile security): http://localhost:9000
