# =============================================================================
# Security tooling overlay (SonarQube)
# =============================================================================
# Preferred (SonarQube lives on the `security` profile in docker-compose.yml):
#   docker compose --profile security up -d sonarqube
#
# Alternate — start SonarQube via this file while attaching to the running app
# network (app stack must already be up so the network exists):
#   docker compose -f docker-compose.security.yml up -d
#
# OWASP ZAP is one-shot (not a compose service). Examples:
#   docker pull zaproxy/zap-stable
#   ./security/scripts/zap-baseline.sh
#   ./security/scripts/zap-api-scan.sh
#   ./security/scripts/sonar-scan.sh   # needs SONAR_TOKEN
#
# Full docs: security/README.md
# =============================================================================

services:
  sonarqube:
    image: sonarqube:community
    container_name: esg-sonarqube
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - esg-network

networks:
  esg-network:
    external: true
    name: esg-reporting-app_esg-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
