# =============================================================================
# ESG Reporting App - Docker Compose
# =============================================================================
# UI:  http://localhost:2048
# API: http://localhost:2047
# Secrets: copy .env.example → .env (never commit real secrets)
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: esg-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-esg_reporting}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/seed-sugar-factory.sql:/docker-entrypoint-initdb.d/03-seed-sugar-factory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esg-network

  redis:
    image: redis:7-alpine
    container_name: esg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esg-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: esg-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 2047
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-esg_reporting}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:2048}
      TRUST_PROXY: "1"
    ports:
      - "2047:2047"
    volumes:
      - upload_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2047/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - esg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api/v1
    container_name: esg-frontend
    restart: unless-stopped
    ports:
      - "2048:2048"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2048/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - esg-network

networks:
  esg-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  upload_data:
  logs_data:
